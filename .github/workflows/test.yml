name: Test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
